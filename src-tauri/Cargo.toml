[package]
name = "sift"
version = "1.1.0"
description = "RAW + JPG Photo Culling Tool"
authors = ["sankigan"]
edition = "2021"

[lib]
name = "sift_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.7"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
trash = "5"
kamadak-exif = "0.6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rayon = "1.10"
natord = "1.0"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
once_cell = "1"
base64 = "0.23"
ts-rs = "12.0.1"
# ~2.5: its minors raise the minimum tauri (2.5 needs 2.12), so a looser range
# could pull tauri past the minor @tauri-apps/api is on in package.json
tauri-plugin-single-instance = "~2.5"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_WindowsProgramming"] }

[dev-dependencies]
tempfile = "3.27.0"

# `tauri dev` builds unoptimized; at opt-level 0 the `image` crate takes ~2s to
# decode one 24MP JPEG for its thumbnail (27x slower than release) and pins every
# core while a folder's thumbnails generate. Optimizing just the image decoding
# crates gets dev within ~15% of optimizing everything, while clippy and test
# builds, which share the dev profile, stay as fast as before: `"*"` also built
# proc-macros at opt-level 3 and nearly doubled cold CI builds.
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.zune-core]
opt-level = 3

[profile.dev.package.moxcms]
opt-level = 3

[profile.dev.package.kamadak-exif]
opt-level = 3
