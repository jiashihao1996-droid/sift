[package]
name = "sift"
version = "1.0.2"
description = "RAW + JPG Photo Culling Tool"
authors = ["sankigan"]
edition = "2021"

[lib]
name = "sift_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.7"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
trash = "5"
kamadak-exif = "0.6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rayon = "1.10"
natord = "1.0"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
once_cell = "1"
base64 = "0.22"
ts-rs = "12.0.1"
# ~2.4: 2.5 requires tauri 2.12, ahead of the 2.10 used here and by @tauri-apps/api
tauri-plugin-single-instance = "~2.4"

[dev-dependencies]
tempfile = "3.27.0"

# `tauri dev` builds unoptimized; at opt-level 0 the `image` crate takes ~2s to
# decode one 24MP JPEG for its thumbnail (27x slower than release) and pins every
# core while a folder's thumbnails generate. Optimizing dependencies only keeps
# Sift's own code quick to rebuild and debuggable.
[profile.dev.package."*"]
opt-level = 3
