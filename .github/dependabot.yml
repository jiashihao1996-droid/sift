# Weekly version updates: minor and patch updates share one PR per ecosystem;
# each major update gets its own PR (one breaking upgrade, such as Tailwind 4,
# must not hold back the others), except packages that must move together.
# Each PR runs CI, so keep the count low.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
    # Skip releases younger than a week (yanked or compromised versions)
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      include: scope
    groups:
      cargo:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 4
    commit-message:
      prefix: chore
      include: scope
    # @types/node follows the Node major in .node-version (what CI and local
    # shells run), not the latest Node
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      npm:
        patterns: ['*']
        update-types: [minor, patch]
      # @vitejs/plugin-vue and vitest declare peer ranges on vite majors
      vite-major:
        patterns: ['vite', '@vitejs/*', 'vitest', '@vitest/*']
        update-types: [major]

  # Third-party actions are pinned to commit SHAs with the version in a comment;
  # Dependabot bumps both. dtolnay/rust-toolchain pins its `stable` branch, which
  # has no version tags, so refresh that SHA by hand.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ['*']
