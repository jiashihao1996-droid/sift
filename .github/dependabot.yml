# Weekly version updates, one grouped PR per ecosystem (majors in a separate
# group so a breaking upgrade does not hold back the rest). Each PR runs CI,
# so keep the count low.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
    # Skip releases younger than a week (yanked or compromised versions)
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore
      include: scope
    groups:
      cargo:
        patterns: ['*']
        update-types: [minor, patch]
      cargo-major:
        patterns: ['*']
        update-types: [major]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm:
        patterns: ['*']
        update-types: [minor, patch]
      npm-major:
        patterns: ['*']
        update-types: [major]

  # Third-party actions are pinned to commit SHAs with the version in a comment;
  # Dependabot bumps both. dtolnay/rust-toolchain pins its `stable` branch, which
  # has no version tags, so refresh that SHA by hand.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ['*']
