name: Release

# Builds a draft GitHub release from a commit that already passed CI on main.
#
# - `npm run release -- x.y.z` opens a release/vx.y.z PR. Auto-merge merges it
#   and dispatches this workflow with the version (pushes and merges made with
#   GITHUB_TOKEN trigger nothing, but dispatches do).
# - After merging a release PR by hand:
#   gh workflow run release.yml --repo jiashihao1996-droid/sift -f version=x.y.z
# - Pushing a v* tag yourself still works; it must point at a commit on main.
#
# `verify` finds the release commit on main, waits for the CI run on that exact
# commit and creates the tag. A release PR always changes Cargo.lock, so that
# run happens anyway: auto-merge dispatches it to refresh the Rust cache, and a
# manual merge triggers it by push. Nothing is retested here; waiting costs
# only Ubuntu minutes.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Version whose release PR is merged, e.g. 1.2.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # Main CI runs Rust on macOS and Windows; the wait covers a slow Windows run
    timeout-minutes: 45
    permissions:
      actions: read
      contents: write
    outputs:
      tag: ${{ steps.commit.outputs.tag }}
      sha: ${{ steps.commit.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Find the release commit
        id: commit
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }

          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            tag="v${INPUT_VERSION#v}"
            # Rebase merges keep the subject; squash merges append " (#N)".
            # awk reads to the end: exiting early would kill git log (pipefail)
            sha=$(git log --format='%H%x09%s' | awk -F '\t' -v s="chore(release): $tag" \
              '!found && ($2 == s || index($2, s " (#") == 1) { print $1; found = 1 }')
            [ -n "$sha" ] || fail "No 'chore(release): $tag' commit on main. Is the release PR merged?"
          else
            tag="$GITHUB_REF_NAME"
            sha=$(git rev-parse "$tag^{commit}")
          fi

          git merge-base --is-ancestor "$sha" HEAD || fail "$tag ($sha) is not on main."
          version=$(git show "$sha:package.json" | jq -r .version)
          [ "v$version" = "$tag" ] || fail "package.json at $sha says $version, not ${tag#v}."
          existing=$(git rev-parse -q --verify "refs/tags/$tag^{commit}" || true)
          if [ -n "$existing" ] && [ "$existing" != "$sha" ]; then
            fail "Tag $tag already points at $existing, not at the release commit $sha."
          fi

          echo "Releasing $tag from $sha"
          {
            echo "tag=$tag"
            echo "sha=$sha"
            echo "create_tag=$([ -z "$existing" ] && echo true || echo false)"
          } >>"$GITHUB_OUTPUT"

      - name: Wait for CI on the release commit
        env:
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }

          # Scheduled runs skip the build jobs and PR runs test the PR head, so
          # only push and dispatch runs count. A dispatched run can take a few
          # seconds to show up.
          run=
          for _ in 1 2 3 4 5 6; do
            run=$(gh run list --workflow ci.yml --commit "$SHA" --limit 20 --json databaseId,event \
              --jq '[.[] | select(.event == "push" or .event == "workflow_dispatch")][0].databaseId // empty')
            [ -n "$run" ] && break
            sleep 20
          done
          [ -n "$run" ] || fail "No CI run on $SHA. Start one with gh workflow run ci.yml --ref main if it is still the tip of main (otherwise push its tag and use --ref <tag>), then re-run this workflow."

          echo "Waiting for CI run $run"
          while :; do
            state=$(gh run view "$run" --json status,conclusion --jq '"\(.status)/\(.conclusion)"')
            case "$state" in
              completed/success) break ;;
              completed/*) fail "CI run $run on $SHA ended $state. Fix or re-run it (gh run rerun $run), then re-run this workflow." ;;
            esac
            sleep 30
          done
          echo "CI run $run passed."

      - name: Create tag
        if: steps.commit.outputs.create_tag == 'true'
        env:
          TAG: ${{ steps.commit.outputs.tag }}
          SHA: ${{ steps.commit.outputs.sha }}
        # A tag pushed with GITHUB_TOKEN does not start another run of this workflow
        run: gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$SHA" --silent

  release:
    needs: verify
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release with Tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.verify.outputs.tag }}
          releaseName: 'Sift ${{ needs.verify.outputs.tag }}'
          releaseBody: 'See [CHANGELOG.md](https://github.com/jiashihao1996-droid/sift/blob/main/CHANGELOG.md) for details.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
