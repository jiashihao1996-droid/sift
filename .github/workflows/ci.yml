name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Auto-merge dispatches this on main after merging: merges made with
  # GITHUB_TOKEN don't trigger push events, and main must save the cache
  workflow_dispatch:

env:
  # CI never needs debug info, and generating it is slowest on Windows
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_INCREMENTAL: 0

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Versions in sync
        run: node scripts/sync-version.mjs --check

      - name: Typecheck, lint, format, test
        run: npm run check

  rust:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          # PRs can only restore caches saved on main; saving per-PR caches
          # just burns minutes in the post step and the 10 GB cache quota
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # tauri::generate_context! embeds the frontend, so dist/ must exist
      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test
