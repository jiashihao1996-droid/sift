name: CI

# On pull requests, `changes` decides which jobs the PR needs; jobs it rules
# out are skipped, which still counts as a successful CI run for auto-merge.
# Rust runs on Windows only for PRs (local `npm run check:rust` covers macOS);
# main runs both platforms.

on:
  pull_request:
  push:
    branches: [main]
  # Auto-merge dispatches this on main after merging a Cargo.lock change:
  # merges made with GITHUB_TOKEN don't trigger push events, and main must
  # save the Rust cache that PRs restore from
  workflow_dispatch:
  # Weekly advisory check: new RustSec advisories land without any code change
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

env:
  # CI never needs debug info, and generating it is slowest on Windows
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_INCREMENTAL: 0

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.classify.outputs.frontend }}
      rust: ${{ steps.classify.outputs.rust }}
      deps: ${{ steps.classify.outputs.deps }}
    steps:
      - name: Classify changed files
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # Renames count on both sides. The API lists at most 3000 files;
          # past that (or for an empty PR) run everything.
          files=$(gh api "repos/$GH_REPO/pulls/$PR/files" --paginate \
            --jq '.[] | .filename, (.previous_filename // empty)')
          count=$(grep -c . <<<"$files" || true)

          frontend=false rust=false deps=false
          if [ "$count" -eq 0 ] || [ "$count" -ge 3000 ]; then
            frontend=true rust=true deps=true
          fi
          while IFS= read -r f; do
            case "$f" in
              '') ;;
              .github/workflows/ci.yml) frontend=true rust=true deps=true ;;
              # Version fields are checked by sync-version.mjs in the frontend job
              src-tauri/Cargo.toml) frontend=true rust=true deps=true ;;
              src-tauri/tauri.conf.json) frontend=true rust=true ;;
              src-tauri/Cargo.lock | src-tauri/deny.toml) rust=true deps=true ;;
              src-tauri/*) rust=true ;;
              # Written by cargo test (ts-rs), type-checked by the frontend
              src/types/generated/*) frontend=true rust=true ;;
              *) frontend=true ;;
            esac
          done <<<"$files"

          {
            echo "frontend=$frontend"
            echo "rust=$rust"
            echo "deps=$deps"
          } | tee -a "$GITHUB_OUTPUT"

  frontend:
    needs: changes
    # changes is skipped outside PRs; !failure() keeps a failed changes job fatal
    if: >-
      !cancelled() && !failure() && github.event_name != 'schedule' &&
      (github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Versions in sync
        run: node scripts/sync-version.mjs --check

      - name: Typecheck, lint, format, test
        run: npm run check

  rust:
    needs: changes
    if: >-
      !cancelled() && !failure() && github.event_name != 'schedule' &&
      (github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true')
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(github.event_name == 'pull_request' && '["windows-latest"]' || '["macos-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: './src-tauri -> target'
          # PRs can only restore caches saved on main; saving per-PR caches
          # just burns minutes in the post step and the 10 GB cache quota
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # tauri::generate_context! embeds the frontend, so dist/ must exist;
      # Rust checks and tests never load it, so a stub stands in for npm run build
      - name: Stub frontend build
        shell: bash
        run: mkdir -p dist && echo '<!doctype html><title>Sift</title>' > dist/index.html

      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test

      # cargo test regenerates src/types/generated via ts-rs; it must match the commit.
      # Windows checks out CRLF while ts-rs writes LF, so line endings don't count.
      - name: Generated TS types are up to date
        shell: bash
        run: |
          dir=src/types/generated
          if ! git diff --exit-code --ignore-cr-at-eol --stat -- "$dir" ||
            [ -n "$(git ls-files --others --exclude-standard -- "$dir")" ]; then
            git status --short -- "$dir"
            echo "::error::Rust models changed without regenerating TS types. Run: npm run gen:types"
            exit 1
          fi

  audit:
    needs: changes
    if: >-
      !cancelled() && !failure() &&
      (github.event_name != 'pull_request' || needs.changes.outputs.deps == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # RustSec advisories; config in src-tauri/deny.toml
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check
          command-arguments: advisories
